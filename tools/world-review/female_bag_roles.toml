lede = "지금 포인트로 되어 있는 여성 가방 26개입니다. 각 가방의 역할(베이스 / 연결템 / 구조템 / 약한포인트 / 포인트)을 정해 주세요. 카드 아래 숫자는 그 역할로 바꿨을 때 이 가방이 들어간 착장의 추천 점수가 지금(포인트)보다 얼마나 바뀌는지 미리 잰 값입니다."
