# 여성 가방 역할 재검수. 지금 30개 중 26개가 포인트라 포인트 아우터·상의와 겹치면 거의
# 언제나 "포인트 과다" 감점이 난다(남성 가방 16개는 포인트 0개). build.py 가 이 파일로 검수
# 페이지를 만든다. 확정되면 id 로 마이그레이션을 쓴다.
#
# impact 는 2026-10-14 측정(`cargo run --example role_effect -- female 가방 out.json`): 그 가방이
# 들어간 착장(상의×하의 전부, 아우터 없음/있음, 신발은 돌려 가며)에서 지금 역할(포인트) 대비
# 운영 엔진(v1) 점수 변화와 shadow 하드필터 판정이 바뀐 수.
#
# 2026-10-14 되돌림: 반영해 보니 사람이 고른 코디 쌍과의 운영 엔진 일치율이 73.3% → 60.0%
# 로 떨어져 20261014000002 마이그레이션으로 다시 포인트로 돌렸다. 여기 결정은 다음에 가방
# 자리 규칙(-8점 슬롯 역할 감점)을 손볼 때 다시 쓴다.
round = "2026-10-14-bag-roles"

