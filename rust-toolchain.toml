# 툴체인을 고정한다.
#
# CI가 `-D warnings`로 clippy를 강제하는데 툴체인이 떠 있으면, 새 stable이 나와
# lint가 추가되는 것만으로 코드 변경 없이 빌드가 깨진다. 실제로 그렇게 한 번 깨졌다:
# 로컬 1.93.1에서는 통과한 코드가 CI의 stable(1.98.0)에서 새 lint 4개에 걸렸다.
#
# rustup은 이 파일을 자동으로 읽으므로 로컬과 CI가 같은 컴파일러를 쓴다.
# 올릴 때는 이 값을 바꾸고, 새로 생긴 lint를 같은 커밋에서 함께 정리한다.

[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
