# 의류 레퍼런스 카탈로그
#
# 이 파일은 Vision 분석이 참고하는 지식 베이스다. `reference_catalog::sync_catalog`
# 가 이름을 키로 업서트하며, 여러 번 실행해도 결과가 같다.
#
# ─── 작성 규칙 ───
#
# embedding_text — 검색용. **관찰 가능한 것만** 적는다. 형태, 여밈, 포켓, 칼라,
#   소재의 겉모습, 실루엣. 브랜드·연혁·착용 맥락은 넣지 않는다. Pass 1 이 내놓는
#   서술과 같은 추상화 수준이어야 유사도가 의미를 갖는다.
#
# description — Pass 2 가 읽는다. 다음을 구분해서 적는다.
#   ① 형태적 특징  ② 소재 특성  ③ 식별 디테일  ④ 혼동하기 쉬운 아이템과의 차이
#   ⑤ 사진만으로 확정할 수 없는 것
#   ⑤를 빠뜨리면 모델이 사진에 없는 정보를 레퍼런스에서 가져다 쓴다.
#
# genres — 확신이 서는 것만. 애매하면 비운다. 현대의 착용 관행이 아니라 이 옷의
#   형태가 근거여야 한다. 값은 `StyleGenre` 어휘와 같다.
#
# review_status — 전부 `draft` 다. **아래 설명은 작성자가 쓴 것이고 검수받지
#   않았다.** draft 는 업로드 분석 경로에서 검색되지 않는다. 틀린 설명은 코드
#   오류를 내지 않고 그대로 Pass 2 의 판단 근거가 되므로, 승인 전에는 실제 분석에
#   영향을 주지 않도록 막아 둔다.

