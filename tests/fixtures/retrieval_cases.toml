# 레퍼런스 검색 평가 케이스.
#
# 각 케이스는 Vision Pass 1 이 내놓을 법한 서술이다. `tests/retrieval_eval.rs` 가 카테고리
# 선필터를 걸고 승인된 레퍼런스만 검색해(업로드 분석과 같은 조건) 정답의 순위를 잰다.
#
# group
#   before   — 정답 레퍼런스를 쓰기 **전에** 쓴 질의. 표현이 새어 들어갈 수 없다.
#   after    — 레퍼런스를 쓴 **뒤에** 쓴 질의. 같은 사람이 썼으므로 표현이 겹쳤을 수 있다.
#   negative — 정답이 지식 베이스에 없다. 무엇이 1위로 걸리는지, 유사도가 얼마인지 본다.
#
# 한계: 여성 옷장에 이미지가 없어서 전부 사람이 쓴 합성 서술이다. 실제 Pass 1 출력을
# 얻을 수 있게 되면 그것으로 바꾸거나 더하는 것이 맞다.

[[cases]]
id = "R001"
group = "before"
category = "아우터"
expected = "M-65 필드 자켓"
query = "올리브색 면나일론 필드 자켓. 스탠드 칼라이고 칼라 뒷면에 지퍼가 있다. 가슴에 플랩 포켓 2개, 허리에 플랩 포켓 2개로 총 4개. 커프스는 벨크로로 조절하며 허리와 밑단에 드로스트링이 있다. 기장은 엉덩이를 덮는 정도이고 소재는 중간 두께의 매트한 질감."

[[cases]]
id = "R002"
group = "before"
category = "아우터"
expected = "MA-1 봄버 자켓"
query = "검정 나일론 봄버 자켓. 목과 손목, 밑단이 모두 니트 리브로 마감되어 몸에 밀착된다. 전면은 풀 지퍼이고 왼쪽 상완에 작은 지퍼 포켓이 하나 있다. 표면에 가벼운 광택이 있고 실루엣은 둥글고 볼륨감이 있다. 기장은 허리까지."

[[cases]]
id = "R003"
group = "before"
category = "하의"
expected = "셀비지 데님 진"
query = "진한 인디고 청바지. 밑단을 접으면 가장자리에 빨간 실선이 보인다. 허리 뒤에 가죽 패치가 붙어 있고 포켓 모서리에 구리색 리벳이 있다. 원단 표면이 거칠고 불균일하며 무릎과 허벅지에 수염 모양 주름 자국이 있다."

[[cases]]
id = "R004"
group = "before"
category = "신발"
expected = "레트로 스니커"
query = "회색 스웨이드와 메쉬가 섞인 로우컷 운동화. 측면에 큰 N자 패널이 붙어 있고 두꺼운 흰색 미드솔을 쓴다. 러닝화 계열의 클래식한 실루엣이고 뒤축에 숫자 모델명이 적혀 있다."

[[cases]]
id = "R005"
group = "before"
category = "상의"
expected = "새틴 블라우스"
query = "아이보리색 새틴 블라우스. 광택이 강하고 표면이 매끄럽다. 넥라인은 둥글고 소매는 퍼프 형태로 부풀어 있으며 손목에 작은 단추가 있다. 원단이 매우 얇고 몸에서 떨어지는 드레이프가 있다."

[[cases]]
id = "R006"
group = "before"
category = "하의"
expected = "플리츠 미디 스커트"
query = "베이지색 플리츠 미디 스커트. 전체에 일정한 주름이 잡혀 있고 허리는 밴딩이다. 기장은 종아리 중간까지 내려오며 걸을 때 주름이 벌어진다. 소재는 얇고 가벼운 폴리에스터."

[[cases]]
id = "R007"
group = "before"
category = "아우터"
expected = "울 테일러드 블레이저"
query = "차콜 그레이 울 블레이저. 노치드 라펠이고 단추 두 개로 여민다. 가슴에 웰트 포켓 하나, 허리에 플랩 포켓 두 개가 있다. 어깨에 패드가 들어가 각이 잡혀 있고 허리선이 다트로 들어가 있다."

[[cases]]
id = "R008"
group = "before"
category = "신발"
expected = "스트랩 힐"
query = "검정 가죽 스트랩 힐. 발등을 가로지르는 얇은 스트랩 두 개와 발목 버클이 있다. 뒤꿈치 굽은 가늘고 높이는 8cm 정도. 앞코는 뾰족하다."

[[cases]]
id = "R009"
group = "before"
category = "아우터"
expected = "크로셰 니트 가디건"
query = "크림색 크로셰 니트 가디건. 손으로 뜬 것처럼 구멍이 숭숭 뚫린 성긴 짜임이고 밑단에 프린지 장식이 달려 있다. 오버사이즈 핏으로 몸에서 크게 떨어진다."

[[cases]]
id = "R010"
group = "before"
category = "가방"
expected = "라피아 토트백"
query = "자연색 라피아 토트백. 식물 섬유를 엮어 만든 거친 표면이고 손잡이는 같은 소재로 두껍게 말려 있다. 형태가 고정되지 않아 위쪽이 벌어진다."

[[cases]]
id = "R011"
group = "before"
category = "하의"
expected = "펜슬 스커트"
query = "검정 펜슬 스커트. 허리에서 밑단까지 폭이 거의 변하지 않고 직선으로 떨어진다. 무릎 위 기장이고 뒤 중앙에 트임과 지퍼가 있다. 소재는 두께가 있는 울 혼방."

[[cases]]
id = "R012"
group = "before"
category = "상의"
expected = "케이블 니트 스웨터"
query = "아이보리색 케이블 니트 스웨터. 앞면에 굵은 꼬임 무늬가 세로로 반복되고 구멍은 없다. 목은 둥글고 리브로 마감됐다. 두툼하고 묵직하다."

[[cases]]
id = "R013"
group = "before"
category = "신발"
expected = "페니 로퍼"
query = "브라운 가죽 로퍼. 끈이 없고 발등에 가로로 덮이는 가죽 밴드가 있다. 굽이 낮고 밑창은 가죽이다. 앞코는 둥글다."

[[cases]]
id = "R014"
group = "before"
category = "하의"
expected = "쉬프트 원피스"
query = "네이비 쉬프트 원피스. 상하가 한 벌로 이어져 있고 허리선이 강조되지 않는다. 민소매이고 무릎 기장이다. 소재는 중간 두께의 매트한 직물."

[[cases]]
id = "R015"
group = "after"
category = "하의"
expected = "와이드 슬랙스"
query = "차콜 울 팬츠. 통이 넓어 허벅지와 밑단 폭 차이가 거의 없다. 앞쪽 가운데에 세로로 다린 선이 있고 허리 밑에 턱 주름이 있다. 벨트 고리가 달렸다."

[[cases]]
id = "R016"
group = "after"
category = "하의"
expected = "스트레이트 데님 팬츠"
query = "중간 톤 블루 청바지. 다리가 곧게 내려가고 무릎 아래가 좁아지지 않는다. 뒤에 덧댄 포켓 두 개, 앞에 작은 동전 포켓이 있다. 밑단은 접혀 있지 않다."

[[cases]]
id = "R017"
group = "after"
category = "하의"
expected = "레깅스"
query = "검정 운동용 하의. 다리에 딱 붙고 허리는 넓은 고무 밴드다. 지퍼나 단추가 없고 발목에서 끝난다. 표면이 매끈하다."

[[cases]]
id = "R018"
group = "after"
category = "상의"
expected = "코튼 포플린 셔츠"
query = "흰색 면 셔츠. 칼라가 빳빳하게 서 있고 앞 단추가 끝까지 이어진다. 소매 끝은 단추 커프스. 원단은 얇고 매끈해서 결이 잘 안 보인다."

[[cases]]
id = "R019"
group = "after"
category = "상의"
expected = "리브 니트 탑"
query = "블랙 터틀넥 니트. 세로로 가는 골이 촘촘하게 나 있고 몸에 꼭 맞는다. 긴소매이고 얇은 편이다."

[[cases]]
id = "R020"
group = "after"
category = "상의"
expected = "캐미솔"
query = "샴페인색 슬립 탑. 실처럼 가는 어깨끈 두 개가 있고 소매가 없다. 앞이 V자로 파였고 원단이 반짝이며 흐르듯 떨어진다."

[[cases]]
id = "R021"
group = "after"
category = "상의"
expected = "크루넥 티셔츠"
query = "흰색 반팔 티. 둥근 목이 얇은 골지로 마감됐고 무늬가 없다. 원단이 평평하고 부드럽다."

[[cases]]
id = "R022"
group = "after"
category = "아우터"
expected = "울 체스터필드 코트"
query = "카멜색 울 롱코트. 무릎까지 내려오고 벨트가 없다. 단추가 한 줄이고 라펠이 있다. 허리 옆에 덮개 포켓이 있다."

[[cases]]
id = "R023"
group = "after"
category = "아우터"
expected = "데님 트러커 자켓"
query = "라이트 블루 청자켓. 허리에서 끝나는 짧은 길이에 셔츠 칼라, 금속 단추가 달렸다. 가슴 포켓 두 개에 덮개가 있고 그 아래로 뾰족한 이음선이 내려간다."

[[cases]]
id = "R024"
group = "after"
category = "아우터"
expected = "가죽 라이더 자켓"
query = "검정 가죽 자켓. 지퍼가 비스듬히 사선으로 올라가고 넓은 라펠을 스냅 단추로 고정했다. 소매 끝에 지퍼가 있고 허리에 벨트가 있다."

[[cases]]
id = "R025"
group = "after"
category = "신발"
expected = "첼시 부츠"
query = "다크브라운 스웨이드 앵클부츠. 끈이 없고 발목 양옆에 늘어나는 밴드가 있다. 뒤에 고리가 달렸고 굽이 낮다."

[[cases]]
id = "R026"
group = "after"
category = "신발"
expected = "발레리나 플랫"
query = "아이보리 플랫 슈즈. 굽이 거의 없고 앞코가 둥글다. 발가락 시작 부분이 보일 만큼 낮게 파였고 앞에 작은 리본이 있다."

[[cases]]
id = "R027"
group = "after"
category = "신발"
expected = "뮬"
query = "블랙 가죽 슬리퍼형 구두. 뒤꿈치가 트여 있고 앞은 막혀 있다. 블록 굽이 5cm 정도."

[[cases]]
id = "R028"
group = "after"
category = "가방"
expected = "가죽 숄더백"
query = "탄색 가죽 가방. 어깨에 걸치는 짧은 끈 하나에 몸체가 반달처럼 부드럽게 처진다. 지퍼로 여민다."

[[cases]]
id = "R029"
group = "after"
category = "가방"
expected = "캔버스 토트백"
query = "생지색 두꺼운 면 가방. 위가 뚫려 있고 손잡이 두 개가 같은 천이다. 바닥이 넓어 세워진다."

[[cases]]
id = "R030"
group = "after"
category = "가방"
expected = "크로스바디 백"
query = "검정 나일론 미니 가방. 길이 조절 버클이 있는 긴 끈으로 몸에 대각선으로 멘다. 앞에 지퍼 포켓이 있다."

[[cases]]
id = "N001"
group = "negative"
category = "아우터"
query = "네이비 트위드 자켓. 굵은 실이 섞여 짠 표면이 거칠고 보풀이 있다. 칼라가 없고 가장자리를 테이프로 둘렀다. 가슴과 허리에 작은 덮개 포켓 네 개, 금색 단추."

[[cases]]
id = "N002"
group = "negative"
category = "아우터"
query = "블랙 숏 패딩. 가로로 누빈 칸마다 부풀어 있고 표면이 반짝이는 나일론이다. 앞은 지퍼이고 스탠드 칼라가 높다."

[[cases]]
id = "N003"
group = "negative"
category = "하의"
query = "카키 카고 팬츠. 허벅지 옆에 덮개 달린 큰 주머니가 붙어 있고 밑단은 조임 끈이다. 면 능직."

[[cases]]
id = "N004"
group = "negative"
category = "상의"
query = "회색 후드티. 모자가 달리고 조임 끈이 있다. 배 앞에 손 넣는 큰 주머니가 하나 있다. 두툼한 면."

[[cases]]
id = "N005"
group = "negative"
category = "신발"
query = "브라운 가죽 글래디에이터 샌들. 끈 여러 개가 발등과 발목을 감고 종아리까지 올라온다. 굽이 없다."

[[cases]]
id = "N006"
group = "negative"
category = "가방"
query = "골드 클러치백. 손잡이와 끈이 없이 손에 쥐는 납작한 가방. 금속 잠금장치가 위에 있다."
# ─── 2차 추가 (임계값 보정용) ───
#
# 정답 질의는 일부러 짧거나 정보가 빠진 형태로 썼다. 실제 Pass 1 은 사진 각도·조명에
# 따라 디테일을 놓치므로, 잘 쓴 서술만으로 보정하면 임계값이 실제보다 높게 잡힌다.
# 음성은 카테고리마다 두세 건씩, 지식 베이스에 가까운 친척이 있는 것을 섞었다.

[[cases]]
id = "R031"
group = "after"
category = "아우터"
expected = "트렌치코트"
query = "베이지 롱코트. 허리에 벨트가 있고 단추가 두 줄이다. 어깨에 작은 끈이 달려 있다."

[[cases]]
id = "R032"
group = "after"
category = "아우터"
expected = "울 테일러드 블레이저"
query = "네이비 재킷. 라펠이 있고 단추 하나로 여민다. 사진이 정면이라 포켓은 잘 안 보인다."

[[cases]]
id = "R033"
group = "after"
category = "하의"
expected = "플리츠 미디 스커트"
query = "검정 스커트. 잔주름이 세로로 촘촘하게 잡혀 있고 길이는 종아리까지 온다."

[[cases]]
id = "R034"
group = "after"
category = "상의"
expected = "새틴 블라우스"
query = "핑크색 블라우스. 반짝이고 매끄럽다. 앞 단추가 있다."

[[cases]]
id = "R035"
group = "after"
category = "상의"
expected = "케이블 니트 스웨터"
query = "회색 스웨터. 앞에 꽈배기 무늬가 있다."

[[cases]]
id = "R036"
group = "after"
category = "신발"
expected = "첼시 부츠"
query = "검정 가죽 앵클부츠. 옆에 고무줄이 들어가 있고 끈은 없다."

[[cases]]
id = "R037"
group = "after"
category = "가방"
expected = "라피아 토트백"
query = "밀짚 느낌의 여름 가방. 엮어 만든 표면이고 손잡이가 두 개다."

[[cases]]
id = "R038"
group = "after"
category = "아우터"
expected = "MA-1 봄버 자켓"
query = "카키색 짧은 점퍼. 소매 끝과 밑단이 쫀쫀한 고무단이다. 지퍼로 여민다."

[[cases]]
id = "R039"
group = "after"
category = "하의"
expected = "와이드 슬랙스"
query = "아이보리 통 넓은 정장 바지. 허리 밑에 주름이 잡혀 있다."

[[cases]]
id = "R040"
group = "after"
category = "상의"
expected = "코튼 포플린 셔츠"
query = "하늘색 셔츠. 칼라가 있고 앞에 단추가 쭉 달렸다. 얇고 빳빳하다."

[[cases]]
id = "R041"
group = "after"
category = "신발"
expected = "페니 로퍼"
query = "와인색 로퍼. 발등 띠에 동전 넣는 홈이 있다."

[[cases]]
id = "R042"
group = "after"
category = "아우터"
expected = "가죽 라이더 자켓"
query = "브라운 가죽 자켓. 지퍼가 비스듬하게 지나간다."

[[cases]]
id = "N007"
group = "negative"
category = "상의"
query = "그린 니트 베스트. 소매가 없고 브이넥이며 셔츠 위에 겹쳐 입는 형태다. 마름모 무늬가 있다."

[[cases]]
id = "N008"
group = "negative"
category = "상의"
query = "화이트 오프숄더 블라우스. 어깨가 드러나도록 넥라인이 가로로 넓게 파였고 고무줄로 잡혀 있다. 소매는 풍성하다."

[[cases]]
id = "N009"
group = "negative"
category = "하의"
query = "화이트 테니스 스커트. 짧은 기장에 주름이 몇 개 크게 잡혀 있고 안에 속바지가 있다."

[[cases]]
id = "N010"
group = "negative"
category = "하의"
query = "검정 바이커 쇼츠. 허벅지 중간까지 오는 짧은 길이에 몸에 딱 붙고 허리는 밴드다."

[[cases]]
id = "N011"
group = "negative"
category = "아우터"
query = "아이보리 플리스 자켓. 털이 보송보송한 합성 원단이고 지퍼로 여민다. 가슴에 작은 덮개 포켓이 있다."

[[cases]]
id = "N012"
group = "negative"
category = "아우터"
query = "네이비 바시티 자켓. 몸판은 울이고 소매는 가죽이다. 목·손목·밑단이 줄무늬 리브이고 가슴에 큰 글자 패치가 있다."

[[cases]]
id = "N013"
group = "negative"
category = "신발"
query = "브라운 웨스턴 부츠. 종아리 중간까지 오고 앞코가 뾰족하며 굽이 높고 비스듬하다. 갑피에 자수 무늬가 있다."

[[cases]]
id = "N014"
group = "negative"
category = "신발"
query = "흰색 하이탑 캔버스 스니커즈. 발목까지 덮고 끈으로 묶는다. 고무 앞코와 고무 밑창이 있다."

[[cases]]
id = "N015"
group = "negative"
category = "신발"
query = "검정 스포츠 샌들. 두꺼운 고무 밑창에 넓은 웨빙 끈 세 줄을 벨크로로 조인다."

[[cases]]
id = "N016"
group = "negative"
category = "가방"
query = "검정 나일론 백팩. 어깨끈 두 개로 등에 메고 앞에 지퍼 포켓이 있다."

[[cases]]
id = "N017"
group = "negative"
category = "가방"
query = "탄색 가죽 버킷백. 원통형 몸체에 입구를 끈으로 조여 닫는다."

[[cases]]
id = "N018"
group = "negative"
category = "하의"
query = "그레이 스웨트 조거 팬츠. 허리는 고무 밴드와 끈이고 발목이 리브로 조여진다. 기모 안감."
