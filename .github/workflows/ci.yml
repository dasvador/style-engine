name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 빌드 로그를 줄이고 캐시 적중률을 높인다.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt · clippy · test · eval
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 툴체인은 rust-toolchain.toml 이 정한다. 러너의 rustup 이 그 파일을 읽어
      # 지정된 버전과 컴포넌트를 자동으로 설치하므로, 로컬과 CI 가 같은 컴파일러를 쓴다.
      # 여기에 버전을 또 적으면 두 곳이 어긋날 수 있다.
      - name: Show toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # 경고를 에러로 승격한다. 예외가 필요한 곳은 코드에 사유를 적은
      # #[allow(...)]로 명시되어 있어야 하며, 여기서 뭉개고 넘어가지 않는다.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # 테스트는 DB도 API 키도 필요하지 않다. 외부 의존이 필요한 검증
      # (모델 비교 등)은 #[ignore]로 분리되어 있다.
      - name: Test
        run: cargo test --all-targets

      # eval 스코어카드는 tests/eval/baseline.json 대비 회귀를 검사한다.
      # 위 test 단계에 포함되지만, 실패 시 원인이 한눈에 보이도록 지표를 출력한다.
      - name: Eval scorecard
        run: cargo test --test eval_scorecard -- --nocapture

      # 스코어카드는 테스트가 재생성하므로, 커밋된 산출물이 현재 엔진과
      # 일치하지 않으면 갱신을 잊은 것이다.
      - name: Committed scorecard is up to date
        run: |
          if ! git diff --exit-code -- tests/eval/; then
            echo "::error::tests/eval/ 산출물이 현재 엔진 상태와 다릅니다."
            echo "로컬에서 'cargo test --test eval_scorecard' 실행 후 결과를 커밋하세요."
            exit 1
          fi
